<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Agent · 六步闯关式交互式学习</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* ── 主题变量 ── */
  :root {
    --bg-0: #0c0e14;
    --bg-1: #12151e;
    --bg-2: #1a1e2a;
    --bg-3: #222738;
    --border: #2d3348;
    --text-1: #e8edf5;
    --text-2: #94a3b8;
    --text-3: #64748b;
    --accent: #60a5fa;
    --accent-2: #a78bfa;
    --green: #4ade80;
    --yellow: #facc15;
    --red: #f87171;
    --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    --font-sans: 'Inter', 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg-0);
    color: var(--text-1);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.65;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── 滚动条 ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-3); }

  /* ── 布局容器 ── */
  .app {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px 20px 60px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* ── 顶部栏 ── */
  .topbar {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.02em;
    color: var(--text-1);
  }
  .logo-icon {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 800; color: #fff;
    box-shadow: 0 4px 12px rgba(96,165,250,0.25);
  }

  /* ── 进度条 ── */
  .progress-wrap {
    flex: 1;
    min-width: 160px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-2);
  }
  .progress-track {
    height: 6px;
    background: var(--bg-3);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 3px;
    transition: width 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    width: 0%;
  }

  /* ── 关卡导航 ── */
  .level-nav {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    padding: 10px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  .level-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-2);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    font-family: var(--font-sans);
  }
  .level-btn:hover:not(.locked) {
    border-color: var(--accent);
    color: var(--text-1);
    background: var(--bg-2);
  }
  .level-btn.active {
    background: var(--bg-2);
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
  }
  .level-btn.locked {
    opacity: 0.4;
    cursor: not-allowed;
    pointer-events: none;
  }
  .level-btn .badge {
    font-size: 11px;
    background: var(--bg-3);
    padding: 1px 6px;
    border-radius: 4px;
    color: var(--text-3);
    font-weight: 600;
  }
  .level-btn.done .badge {
    background: rgba(74,222,128,0.15);
    color: var(--green);
  }
  .level-btn .num {
    font-weight: 700;
    font-size: 14px;
    color: var(--text-1);
  }

  /* ── 内容面板 ── */
  .stage-panel {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    display: none;
    animation: fadeSlide 0.35s ease-out;
  }
  .stage-panel.active { display: block; }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .stage-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .stage-num {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    background: rgba(96,165,250,0.1);
    padding: 2px 8px;
    border-radius: 4px;
    letter-spacing: 0.05em;
  }
  .stage-title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text-1);
  }
  .stage-sub {
    font-size: 13px;
    color: var(--text-3);
    margin-left: auto;
  }

  /* ── 知识点卡片 ── */
  .card {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .card h3 {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .card ul, .card ol {
    padding-left: 20px;
    color: var(--text-2);
  }
  .card li { margin-bottom: 4px; }
  .card p { color: var(--text-2); margin-bottom: 4px; }

  /* ── 代码块 ── */
  .code-block {
    position: relative;
    background: #0a0c12;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .code-block pre {
    margin: 0;
    padding: 14px 14px 14px 44px;
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.6;
    color: #c9d1d9;
    overflow-x: auto;
    white-space: pre;
    tab-size: 2;
  }
  .code-block .copy-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    background: var(--bg-3);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-3);
    font-size: 11px;
    padding: 3px 8px;
    cursor: pointer;
    font-family: var(--font-sans);
    transition: all 0.15s;
    opacity: 0;
  }
  .code-block:hover .copy-btn { opacity: 1; }
  .code-block .copy-btn:hover {
    color: var(--text-1);
    background: var(--bg-2);
    border-color: var(--text-3);
  }
  .code-block .copy-btn.copied {
    background: rgba(74,222,128,0.15);
    color: var(--green);
    border-color: var(--green);
  }

  /* ── 语法高亮（简易） ── */
  .hl-kw { color: #ff7b72; }
  .hl-str { color: #a5d6ff; }
  .hl-cmt { color: #8b949e; font-style: italic; }
  .hl-fn { color: #d2a8ff; }
  .hl-num { color: #79c0ff; }
  .hl-type { color: #ffa657; }
  .hl-var { color: #ffa657; }
  .hl-prop { color: #79c0ff; }
  .hl-op  { color: #ff7b72; }
  .hl-bg  { background: rgba(255,255,255,0.03); }

  /* ── 扩展卡片 ── */
  .expand-card {
    background: rgba(167,139,250,0.06);
    border-left: 3px solid var(--accent-2);
    border-radius: 0 6px 6px 0;
    padding: 12px 16px;
    margin-bottom: 14px;
  }
  .expand-card h4 {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent-2);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }
  .expand-card p, .expand-card ul {
    color: var(--text-2);
    font-size: 14px;
  }

  /* ── 判断题 ── */
  .quiz {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 14px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 16px;
  }
  .quiz-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  .quiz-item:last-child { border-bottom: none; }
  .quiz-q {
    font-weight: 500;
    color: var(--text-1);
    flex: 1;
    font-size: 14px;
  }
  .quiz-opts {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .quiz-opt {
    padding: 3px 10px;
    background: var(--bg-3);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-2);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--font-sans);
    font-weight: 500;
  }
  .quiz-opt:hover { border-color: var(--accent); color: var(--text-1); }
  .quiz-opt.selected {
    background: rgba(96,165,250,0.15);
    border-color: var(--accent);
    color: var(--accent);
  }
  .quiz-opt.correct {
    background: rgba(74,222,128,0.15);
    border-color: var(--green);
    color: var(--green);
  }
  .quiz-opt.wrong {
    background: rgba(248,113,113,0.15);
    border-color: var(--red);
    color: var(--red);
  }
  .quiz-feedback {
    font-size: 12px;
    color: var(--text-3);
    margin-top: 2px;
    min-height: 16px;
  }
  .quiz-feedback.correct { color: var(--green); }
  .quiz-feedback.wrong   { color: var(--red); }

  /* ── 完成按钮 ── */
  .done-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none;
    border-radius: 6px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: var(--font-sans);
    box-shadow: 0 2px 8px rgba(96,165,250,0.3);
  }
  .done-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(96,165,250,0.4);
  }
  .done-btn:active { transform: translateY(0); }
  .done-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }
  .done-btn.done {
    background: var(--green);
    box-shadow: 0 2px 8px rgba(74,222,128,0.3);
  }

  /* ── 底部参考区 ── */
  .refs {
    border-top: 1px solid var(--border);
    padding-top: 16px;
    margin-top: 8px;
  }
  .refs h3 {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 10px;
  }
  .ref-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .ref-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-2);
    font-size: 12px;
    text-decoration: none;
    transition: all 0.15s;
  }
  .ref-link:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--bg-3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 16px;
    color: var(--text-1);
    font-size: 13px;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    z-index: 999;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── 响应式微调 ── */
  @media (max-width: 640px) {
    .app { padding: 16px 12px 40px; }
    .topbar { gap: 10px; }
    .logo { font-size: 16px; }
    .stage-title { font-size: 18px; }
    .code-block pre { padding: 12px 12px 12px 36px; font-size: 12px; }
    .level-btn { font-size: 12px; padding: 4px 8px; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- ═══ 顶部 ═══ -->
  <div class="topbar">
    <div class="logo">
      <div class="logo-icon">H</div>
      <span>Hermes Agent</span>
      <span style="color:var(--text-3);font-weight:400;font-size:13px;">· 六步闯关</span>
    </div>
    <div class="progress-wrap">
      <div class="progress-label">
        <span>总进度</span>
        <span id="progress-pct">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>
  </div>

  <!-- ═══ 关卡导航 ═══ -->
  <div class="level-nav" id="level-nav"></div>

  <!-- ═══ 关卡内容容器 ═══ -->
  <div id="stages-container"></div>

  <!-- ═══ 底部参考 ═══ -->
  <div class="refs">
    <h3>📚 参考文献 · 官方文档</h3>
    <div class="ref-list" id="ref-list"></div>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════
   Hermes Agent 六步闯关学习 — 数据 + 渲染 + 交互
   ═══════════════════════════════════════════════════════ */

const STAGES = [
  {
    id: 1,
    num: '01',
    title: 'Installation',
    subtitle: '安装 Hermes Agent',
    lockNote: '完成上一关后解锁',
    knowledge: [
      { title: '安装器原理', body: 'Hermes 安装器是一个自解压脚本（curl / PowerShell），它自动完成以下工作：创建隔离的 Python 虚拟环境、安装 uv 包管理器、部署 Node.js（Playwright）、拉取 ripgrep 和 ffmpeg 到系统 PATH。用户无需手动安装任何运行时依赖。' },
      { title: '内置组件作用', body: [
        'uv — Python 包管理器 + 虚拟环境生命周期管理',
        'Python 3.11+ — Hermes 本体运行环境（隔离 venv）',
        'Node.js v18+ — 浏览器自动化（Playwright）依赖',
        'ripgrep (rg) — 项目内快速文件搜索（系统 PATH）',
        'ffmpeg — TTS / 音频格式转换（系统 PATH）',
        'hermes CLI — 全局命令入口（~/.local/bin 或 /usr/local/bin）'
      ]},
      { title: '平台安装命令', body: [
        'Linux / macOS / WSL2 / Termux:  curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash',
        'Windows 原生（PowerShell）:     iex (irm https://hermes-agent.nousresearch.com/install.ps1)',
        'Windows 推荐: 先装 WSL2，再在 WSL2 中跑 curl 脚本；也可下载 Hermes Desktop 安装器'
      ]},
      { title: '环境变量配置', body: '安装后将二进制路径加入 shell PATH：普通用户默认 ~/.local/bin，root 模式 /usr/local/bin。重载 shell 后即可全局使用 hermes 命令。' }
    ],
    codeExample: `<span class="hl-cmt"># ── Windows PowerShell 安装 ──</span>
iex (irm https://hermes-agent.nousresearch.com/install.ps1)

<span class="hl-cmt"># ── 重载 shell（让 PATH 生效） ──</span>
<span class="hl-kw">$</span> <span class="hl-fn">refreshenv</span>   <span class="hl-cmt"># 或关闭 re-opening PowerShell</span>

<span class="hl-cmt"># ── 版本验证 ──</span>
hermes --version
<span class="hl-cmt"># 预期输出：hermes-agent x.y.z</span>

<span class="hl-cmt"># ── 官方自检 ──</span>
hermes doctor
<span class="hl-cmt"># 检查依赖、模型配置、工具链。仅提示可忽略项即通过。</span>

<span class="hl-cmt"># ── 彻底重装（谨慎：会删除 ~/.hermes/ 记忆） ──</span>
rm -rf ~/.hermes/ ~/.local/share/hermes/
<span class="hl-cmt"># 再重新运行安装脚本</span>`,
    expand: {
      title: '🔌 拓展：OpenAI CLI / Anthropic CLI 安装对比',
      body: [
        'OpenAI CLI (CLI 由 openai-api 提供): pip install openai → 依赖 Python + pip，由用户自行管理虚拟环境。API Key 通过 OPENAI_API_KEY 环境变量传递。',
        'Anthropic CLI (claude CLI): npm install -g @anthropic-ai/claude-cli → 依赖 Node.js + npm。OAuth 或 API Key 同样通过环境变量或配置文件注入。',
        'Hermes 的优势: 安装器一次性完成所有依赖（uv + Node.js + ripgrep + ffmpeg），用户无需手动配置 Python 环境。且 Hermes 统一抽象了多家 provider，无需为每个供应商安装单独 CLI。'
      ]
    },
    quiz: [
      { q: 'Hermes 安装器会自动安装 Python、Node.js、ripgrep 和 ffmpeg，无需用户手动安装。', ok: ['正确', '错误'], ans: 0,
        explain: '安装器是一条 curl/PowerShell 脚本，它自动搭建隔离运行环境，用户不需要手动安装这些依赖。' },
      { q: 'Windows 用户只能通过 WSL2 安装 Hermes，不支持原生 PowerShell。', ok: ['正确', '错误'], ans: 1,
        explain: 'Windows 原生支持：iex (irm https://hermes-agent.nousresearch.com/install.ps1)。WSL2 是推荐但非必须的路径。' },
      { q: 'hermes doctor 命令用于检查依赖、模型配置和工具链是否就绪。', ok: ['正确', '错误'], ans: 0,
        explain: 'hermes doctor 是官方自检命令，检查全部依赖和配置，仅提示可忽略项即算通过。' }
    ],
    verifyList: [
      '执行安装脚本且未报致命错误',
      '重载 shell 后 hermes --version 正常输出版本号',
      '运行 hermes doctor 自检通过（或仅提示可忽略项）',
      '确认 hermes 二进制路径已加入当前 shell 的 PATH',
      '查看 ~/.hermes/logs/ 目录，确认无持续报错'
    ],
    docs: [
      { label: '官方安装文档', url: 'https://hermes-agent.nousresearch.com/docs/getting-started/installation' },
      { label: '官方学习路径', url: 'https://hermes-agent.nousresearch.com/docs/getting-started/learning-path' },
      { label: 'GitHub 仓库', url: 'https://github.com/NousResearch/hermes-agent' }
    ]
  },
  {
    id: 2,
    num: '02',
    title: 'Quickstart',
    subtitle: '快速上手与首次对话',
    knowledge: [
      { title: '初始化流程', body: '首次运行 hermes 会启动模型配置向导（hermes model），提示选择 provider、OAuth 登录或粘贴 API Key。配置完成后，欢迎横幅显示当前模型、可用工具、已装 skill。' },
      { title: '模型配置向导', body: '运行 hermes model 进入交互式向导：选择 provider 类型 → 完成 OAuth 登录 或 粘贴 API Key → 确认模型名称。向导将配置写入 ~/.hermes/config.yaml。' },
      { title: 'TUI 与 CLI 两种界面', body: [
        'hermes           — 经典 CLI 模式，纯文本交互',
        'hermes --tui     — 现代 TUI（推荐），支持鼠标、覆盖层、快捷键、方向键滚动、Tab 切换面板',
        'TUI 启动后显示欢迎横幅：模型名、工具列表、skill 列表、会话上下文长度'
      ]}
    ],
    codeExample: `<span class="hl-cmt"># ── 交互式模型配置向导 ──</span>
hermes model
<span class="hl-cmt"># 选择 provider → OAuth 登录 或 输入 API Key → 选定模型</span>

<span class="hl-cmt"># ── 一键登录（Nous Portal，覆盖 300+ 模型） ──</span>
hermes setup --portal

/* ═══════════════════════════════════════════════════════
   localStorage 进度存储
   ═══════════════════════════════════════════════════════ */
const LS_KEY = 'hermes-agent-6steps-progress';

function loadProgress() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return { completed: {}, quizAns: {} };
    const data = JSON.parse(raw);
    return {
      completed: data.completed || {},
      quizAns: data.quizAns || {}
    };
  } catch { return { completed: {}, quizAns: {} }; }
}
function saveProgress(completed, quizAns) {
  localStorage.setItem(LS_KEY, JSON.stringify({ completed, quizAns }));
}

/* ═══════════════════════════════════════════════════════
   渲染函数
   ═══════════════════════════════════════════════════════ */
const progressFill = document.getElementById('progress-fill');
const progressPct  = document.getElementById('progress-pct');
const levelNav     = document.getElementById('level-nav');
const stagesCtr    = document.getElementById('stages-container');
const refList      = document.getElementById('ref-list');
const toastEl      = document.getElementById('toast');

let currentStage = 1;
let progress = loadProgress();

function renderRefList() {
  const seen = new Set();
  const items = [];
  for (const s of STAGES) {
    for (const d of s.docs) {
      if (!seen.has(d.url)) {
        seen.add(d.url);
        items.push(d);
      }
    }
  }
  refList.innerHTML = items.map(d =>
    `<a class="ref-link" href="${d.url}" target="_blank" rel="noopener">📄 ${d.label}</a>`
  ).join('');
}

function renderLevelNav() {
  levelNav.innerHTML = STAGES.map((s, idx) => {
    const isLocked = idx > 0 && !progress.completed[STAGES[idx-1].id];
    const isDone   = !!progress.completed[s.id];
    const isActive = s.id === currentStage;
    return `<button class="level-btn ${isActive?'active':''} ${isDone?'done':''} ${isLocked?'locked':''}"
            data-stage="${s.id}" ${isLocked?'disabled':''}>
            <span class="num">${s.num}</span>
            ${s.title}
            <span class="badge">${isDone?'✓已完成':(isLocked?'🔒':s.id===currentStage?'●当前':'');}</span>
          </button>`;
  }).join('');
  levelNav.querySelectorAll('.level-btn:not(.locked)').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = parseInt(btn.dataset.stage);
      if (id !== currentStage) switchStage(id);
    });
  });
}

function renderStageContent(stage) {
  // 找到 stage 数据
  const s = STAGES.find(st => st.id === stage.id);
  if (!s) return;

  // 构建知识点 HTML
  let knowledgeHtml = s.knowledge.map(k => {
    if (Array.isArray(k.body)) {
      return `<div class="card">
        <h3>${k.title}</h3>
        <ul>${k.body.map(b => `<li>${b}</li>`).join('')}</ul>
      </div>`;
    }
    return `<div class="card">
      <h3>${k.title}</h3>
      <p>${k.body}</p>
    </div>`;
  }).join('');

  // 代码块 HTML
  const codeHtml = s.codeExample;

  // 拓展卡片
  const expandHtml = s.expand ? `
    <div class="expand-card">
      <h4>${s.expand.title}</h4>
      ${Array.isArray(s.expand.body) ? s.expand.body.map(b => `<p>${b}</p>`).join('') : `<p>${s.expand.body}</p>`}
    </div>` : '';

  // 判断题
  let quizHtml = `<div class="quiz" id="quiz-area">`;
  s.quiz.forEach((q, qi) => {
    const ans = progress.quizAns[stage.id]?.[qi];
    const isCorrect = ans === q.ans;
    quizHtml += `
      <div class="quiz-item" data-qi="${qi}">
        <div class="quiz-q">${qi+1}. ${q.q}</div>
        <div class="quiz-opts">
          ${q.ok.map((opt, oi) => {
            let cls = '';
            if (ans === oi) cls = 'selected';
            if (isCorrect && ans === q.ans && oi === q.ans) cls = 'correct';
            if (isCorrect && ans !== q.ans && oi === ans) cls = 'wrong';
            return `<button class="quiz-opt ${cls}" data-qi="${qi}" data-oi="${oi}">${opt}</button>`;
          }).join('')}
        </div>
      </div>
      <div class="quiz-feedback ${isCorrect?'correct':(ans===undefined?'':'wrong')}" id="quiz-fb-${qi}">
        ${ans===undefined ? '' : (isCorrect ? '✓ ' + q.explain : '✗ ' + q.explain)}
      </div>`;
  });
  quizHtml += `</div>`;

  // 验收清单
  const verifyHtml = s.verifyList.map((v, vi) => `
    <label class="flex items-start gap-2 cursor-pointer group" style="padding:3px 0;color:var(--text-2);font-size:14px;">
      <input type="checkbox" data-vi="${vi}" ${progress.completed[stage.id]?.verify?.[vi]?'checked':''} class="mt-0.5 accent-[var(--accent)]">
      <span>${v}</span>
    </label>`).join('');

  // 完成按钮状态
  const allChecked = s.verifyList.every((_, vi) => progress.completed[stage.id]?.verify?.[vi]);
  const stageDone = !!progress.completed[stage.id]?.done;
  const isLastUnlocked = stage.id === 1 || progress.completed[stage.id-1]?.done;

  const doneBtnHtml = `
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--border);">
      <button class="done-btn ${stageDone?'done':''}" id="done-btn" ${!isLastUnlocked && !stageDone?'disabled':''}>
        ${stageDone ? '✓ 本关已完成' : (isLastUnlocked ? '✓ 勾选完成，解锁下一关' : '完成勾选后解锁下一关')}
      </button>
      <span style="font-size:12px;color:var(--text-3);">
        验收 ${progress.completed[stage.id]?.verify?countChecked(progress.completed[stage.id].verify):0} / ${s.verifyList.length}
        ${stageDone ? '· 已解锁' : ''}
      </span>
    </div>`;

  // 底部 docs
  const docsHtml = s.docs.map(d =>
    `<a class="ref-link" href="${d.url}" target="_blank" rel="noopener" style="margin-top:6px;display:inline-flex;">📄 ${d.label} →</a>`
  ).join('');

  // 填充容器
  stagesCtr.innerHTML = STAGES.map((st, idx) => {
    const isActive = st.id === stage.id;
    const isLocked = idx > 0 && !progress.completed[STAGES[idx-1].id];
    return `<div class="stage-panel ${isActive?'active':''}" data-stage="${st.id}" style="${isLocked && isActive ? 'display:none;' : ''}">
      <div class="stage-header">
        <span class="stage-num">${st.num}</span>
        <span class="stage-title">${st.title}</span>
        <span class="stage-sub">${st.subtitle}${isLocked && !isActive ? ' · '+st.lockNote : ''}</span>
      </div>

      <div style="display:grid;gap:12px;">
        ${knowledgeHtml}
        <div class="card">
          <h3>💻 代码示例</h3>
          <div class="code-block">
            <button class="copy-btn" data-code="${encodeURIComponent(st.codeExample)}">📋 复制</button>
            <pre>${st.codeExample}</pre>
          </div>
        </div>
        ${expandHtml}
        ${quizHtml}
        <div class="card">
          <h3>✅ 验收清单</h3>
          <div style="display:flex;flex-direction:column;gap:4px;">${verifyHtml}</div>
        </div>
        ${doneBtnHtml}
        <div style="margin-top:8px;">
          <h3 style="font-size:13px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:6px;">📚 本关参考文档</h3>
          ${docsHtml}
        </div>
      </div>
    </div>`;
  }).join('');

  // 绑定当前面板的交互
  bindStageEvents(stage.id);
}

function countChecked(verify) {
  return Object.values(verify).filter(Boolean).length;
}

function updateProgress() {
  const total = STAGES.length;
  const done = STAGES.filter(s => progress.completed[s.id]?.done).length;
  const pct = total === 0 ? 0 : Math.round((done / total) * 100);
  progressFill.style.width = pct + '%';
  progressPct.textContent = pct + '%';

  // 更新导航按钮状态
  renderLevelNav();
}

function switchStage(id) {
  currentStage = id;
  // 淡出当前 → 淡入新
  const oldPanel = stagesCtr.querySelector('.stage-panel.active');
  if (oldPanel) {
    oldPanel.style.transition = 'opacity 0.2s, transform 0.2s';
    oldPanel.style.opacity = '0';
    oldPanel.style.transform = 'translateY(8px)';
    setTimeout(() => {
      oldPanel.classList.remove('active');
      oldPanel.style.opacity = '';
      oldPanel.style.transform = '';
      renderStageContent(STAGES.find(s => s.id === id));
    }, 200);
  } else {
    renderStageContent(STAGES.find(s => s.id === id));
  }
  updateProgress();
}

function showToast(msg, duration = 2000) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastEl._timer);
  toastEl._timer = setTimeout(() => toastEl.classList.remove('show'), duration);
}

function bindStageEvents(stageId) {
  const s = STAGES.find(st => st.id === stageId);

  // ── 判断题选项点击 ──
  document.querySelectorAll('.quiz-opt').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const qi = parseInt(btn.dataset.qi);
      const oi = parseInt(btn.dataset.oi);
      const q = s.quiz[qi];
      if (!q) return;

      // 更新 quizAns
      if (!progress.quizAns[stageId]) progress.quizAns[stageId] = {};
      progress.quizAns[stageId][qi] = oi;
      saveProgress(progress.completed, progress.quizAns);

      // 重新渲染该判断题组的状态
      renderStageContent(STAGES.find(st => st.id === stageId));
      showToast(q.ans === oi ? '✓ 回答正确' : '✗ 回答错误，再想想~', 1500);
    });
  });

  // ── 验收勾选框 ──
  document.querySelectorAll('.quiz-area + .card input[type=checkbox], .card input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', (e) => {
      const vi = parseInt(cb.dataset.vi);
      if (isNaN(vi)) return;
      if (!progress.completed[stageId]) progress.completed[stageId] = { verify: {}, done: false };
      if (!progress.completed[stageId].verify) progress.completed[stageId].verify = {};
      progress.completed[stageId].verify[vi] = cb.checked;
      saveProgress(progress.completed, progress.quizAns);
      renderStageContent(STAGES.find(st => st.id === stageId));
    });
  });

  // ── 复制按钮 ──
  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const code = decodeURIComponent(btn.dataset.code);
      navigator.clipboard.writeText(code).then(() => {
        btn.textContent = '✓ 已复制';
        btn.classList.add('copied');
        showToast('✨ 代码已复制到剪贴板', 1500);
        setTimeout(() => {
          btn.textContent = '📋 复制';
          btn.classList.remove('copied');
        }, 2000);
      }).catch(() => {
        // fallback
        const ta = document.createElement('textarea');
        ta.value = code;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        btn.textContent = '✓ 已复制';
        btn.classList.add('copied');
        showToast('✨ 代码已复制到剪贴板', 1500);
        setTimeout(() => {
          btn.textContent = '📋 复制';
          btn.classList.remove('copied');
        }, 2000);
      });
    });
  });

  // ── 完成按钮 ──
  const doneBtn = document.getElementById('done-btn');
  if (doneBtn) {
    doneBtn.addEventListener('click', () => {
      if (progress.completed[stageId]?.done) {
        showToast('✓ 该关卡已完成', 1500);
        return;
      }
      // 检查是否全选
      const allChecked = s.verifyList.every((_, vi) => progress.completed[stageId]?.verify?.[vi]);
      if (!allChecked) {
        showToast('⚠️ 请先完成所有验收项的勾选', 2000);
        return;
      }
      // 标记完成
      if (!progress.completed[stageId]) progress.completed[stageId] = { verify: {}, done: false };
      progress.completed[stageId].done = true;
      saveProgress(progress.completed, progress.quizAns);
      renderStageContent(STAGES.find(st => st.id === stageId));
      updateProgress();
      showToast(`🎉 第 ${s.num} 关「${s.title}」完成！下一关已解锁`, 2500);
    });
  }
}

renderRefList();

// 键盘快捷键：左右箭头切换关卡
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    const idx = STAGES.findIndex(s => s.id === currentStage);
    if (idx < STAGES.length - 1) {
      const next = STAGES[idx + 1];
      if (!progress.completed[next.id - 1]?.done && next.id > 1) return; // 前一关未完成则不跳
      switchStage(next.id);
    }
    e.preventDefault();
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    const idx = STAGES.findIndex(s => s.id === currentStage);
    if (idx > 0) {
      switchStage(STAGES[idx - 1].id);
    }
    e.preventDefault();
  }
});
